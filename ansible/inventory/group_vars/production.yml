---
# ============================================================
# Production Environment Variables
# ============================================================

env_name: production
repo_branch: main
nginx_tls_enabled: true
nginx_waf_enabled: true
compose_file_list: "docker-compose.yml:docker-compose.production.yml"
compose_build: false
compose_pull: true

# The frontend is deployed by Vercel and host Nginx terminates TLS. Building
# the web and container-proxy images on the small EC2 host wastes memory and
# previously exhausted the 30-minute Compose build timeout.
compose_build_services:
  - api
compose_pull_services:
  - api
  - worker
  - ai-dispatcher
compose_run_services:
  - redis
  - api
  - worker
  - ai-dispatcher

# The EC2 host serves only the API. The public application is hosted by
# Vercel, so keep the TLS hostname and browser-facing origin separate.
server_name: "api.coditent.app"
grafana_server_name: "grafana.coditent.app"
frontend_url: "https://coditent.app"
next_public_ws_url: "wss://api.coditent.app/api-proxy"
admin_origin: "https://admin.coditent.app"
cors_origins: "https://coditent.app,https://www.coditent.app,https://admin.coditent.app"
# OAuth starts through the public API proxy, which sets a host-bound browser
# cookie used to validate the callback. Keep the callback on that same origin.
google_redirect_uri: "https://coditent.app/api-proxy/auth/sso/google/callback"
linkedin_redirect_uri: "https://coditent.app/api-proxy/auth/sso/linkedin/callback"
resend_from_email: "notifications@coditent.app"
letsencrypt_email: "notifications@coditent.app"

# In production, Supabase and AI keys can be provided via:
# 1. ansible-vault (e.g. including vault.yml)
# 2. Extra vars from CI/CD: --extra-vars "database_url=... supabase_url=..."
# 3. Existing /opt/coditent/.env on the remote server

database_url: "{{ vault_database_url | default(lookup('env', 'DATABASE_URL')) | default('') }}"
supabase_url: "{{ vault_supabase_url | default(lookup('env', 'SUPABASE_URL')) | default('') }}"
supabase_service_key: "{{ vault_supabase_service_key | default(lookup('env', 'SUPABASE_SERVICE_KEY')) | default('') }}"
next_public_supabase_url: "{{ vault_next_public_supabase_url | default(lookup('env', 'NEXT_PUBLIC_SUPABASE_URL')) | default(supabase_url) }}"
next_public_supabase_publishable_key: "{{ vault_next_public_supabase_publishable_key | default(lookup('env', 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY')) | default('') }}"

jwt_secret: "{{ vault_jwt_secret | default(lookup('env', 'JWT_SECRET')) | default('') }}"
totp_encryption_key: "{{ vault_totp_encryption_key | default(lookup('env', 'TOTP_ENCRYPTION_KEY')) | default('') }}"
email_outbox_encryption_key: "{{ vault_email_outbox_encryption_key | default(lookup('env', 'EMAIL_OUTBOX_ENCRYPTION_KEY')) | default('') }}"
gemini_api_key: "{{ vault_gemini_api_key | default(lookup('env', 'GEMINI_API_KEY')) | default('') }}"
redis_url: "redis://redis:6380/0"
backup_s3_uri: "{{ vault_backup_s3_uri | default(lookup('env', 'BACKUP_S3_URI')) | default('') }}"
backup_aws_region: "{{ vault_backup_aws_region | default(lookup('env', 'BACKUP_AWS_REGION')) | default('') }}"
