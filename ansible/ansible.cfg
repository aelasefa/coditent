[defaults]
inventory = inventory/hosts.ini
roles_path = roles
remote_user = ubuntu
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
callbacks_enabled = timer, profile_tasks
pipelining = True
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# StrictHostKeyChecking is intentionally omitted here.
# In CI, the workflow sets ANSIBLE_HOST_KEY_CHECKING=False via env var.
# For local runs, known_hosts is managed per-user as normal.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes
