---
- name: Build and start application containers with Docker Compose
  ansible.builtin.command:
    cmd: "docker compose up -d {% if compose_build | default(true) %}--build{% endif %} {% if compose_remove_orphans | default(true) %}--remove-orphans{% endif %}"
    chdir: "{{ app_dir }}"
  register: compose_output
  # Docker Compose v2 uses 'Started', 'Recreated', 'Created' instead of the
  # old v1 strings 'Creating' / 'Recreating'. Match both stdout and stderr
  # since compose v2 logs to stdout while some build output goes to stderr.
  changed_when: >-
    'Started'   in (compose_output.stderr + compose_output.stdout) or
    'Recreated' in (compose_output.stderr + compose_output.stdout) or
    'Created'   in (compose_output.stderr + compose_output.stdout) or
    'Building'  in (compose_output.stderr + compose_output.stdout)

- name: Retrieve container status
  ansible.builtin.command:
    cmd: "docker compose ps --format 'table {{'{{'}}.Name{{'}}'}}\t{{'{{'}}.Status{{'}}'}}\t{{'{{'}}.Ports{{'}}'}}'"
    chdir: "{{ app_dir }}"
  register: container_status
  changed_when: false

- name: Display running containers
  ansible.builtin.debug:
    var: container_status.stdout_lines
