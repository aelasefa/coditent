---
- name: Wait for application dependencies to become ready
  ansible.builtin.uri:
    url: "{{ healthcheck_url }}"
    method: GET
    status_code: 200
    return_content: yes
  register: api_health
  until: api_health.status == 200
  retries: "{{ healthcheck_retries | default(15) }}"
  delay: "{{ healthcheck_delay | default(5) }}"

- name: Verify application readiness response content
  ansible.builtin.assert:
    that:
      - api_health.status == 200
      - (api_health.json.status | default('')) == 'ready'
    fail_msg: "Application readiness check failed: {{ api_health.content }}"
    success_msg: "Application readiness check passed"

- name: Record deployment metadata
  ansible.builtin.copy:
    dest: "{{ app_dir }}/.deployment_info"
    mode: '0644'
    content: |
      Deployment Timestamp: {{ ansible_date_time.iso8601 }}
      Branch: {{ repo_branch }}
      Commit: {{ current_commit.stdout | default('unknown') }}
      Deployed By: Ansible
