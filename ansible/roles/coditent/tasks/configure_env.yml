---
- name: Check if remote .env already exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/.env"
  register: remote_root_env

- name: Render root .env file from template
  ansible.builtin.template:
    src: root.env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  when: (database_url is defined and database_url != '') or not remote_root_env.stat.exists

# Existing production .env files deliberately survive deployments so secrets
# are not erased when CI does not pass them again. Reconcile the non-secret
# deployment values separately so older hosts still receive new required
# Compose variables and canonical public URLs.
- name: Reconcile non-secret production settings in the preserved root environment
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  loop:
    - key: APP_ENV
      value: "{{ 'production' if env_name in ['production', 'staging'] else 'development' }}"
    - key: COMPOSE_FILE
      value: "{{ compose_file_list | default('docker-compose.yml') }}"
    - key: NEXT_PUBLIC_API_URL
      value: "{{ next_public_api_url }}"
    - key: NEXT_PUBLIC_OAUTH_API_URL
      value: "{{ next_public_oauth_api_url }}"
    - key: FRONTEND_URL
      value: "{{ frontend_url }}"
    - key: CORS_ORIGINS
      value: "{{ cors_origins }}"
    - key: ACCESS_TOKEN_COOKIE_SECURE
      value: "{{ 'true' if env_name in ['production', 'staging'] else 'false' }}"
    - key: AI_USER_DAILY_QUOTA_UNITS
      value: "{{ ai_user_daily_quota_units }}"
    - key: GOOGLE_REDIRECT_URI
      value: "{{ google_redirect_uri }}"
    - key: LINKEDIN_REDIRECT_URI
      value: "{{ linkedin_redirect_uri }}"
    - key: GF_SERVER_DOMAIN
      value: "{{ gf_server_domain | default('grafana.coditent.app') }}"
    - key: GF_SERVER_ROOT_URL
      value: "{{ gf_server_root_url | default('https://grafana.coditent.app/') }}"
    - key: GF_SERVER_PROTOCOL
      value: "{{ gf_server_protocol | default('http') }}"
    - key: GF_AUTH_ANONYMOUS_ENABLED
      value: "{{ gf_auth_anonymous_enabled | default('false') }}"
    - key: GF_USERS_ALLOW_SIGN_UP
      value: "{{ gf_users_allow_sign_up | default('false') }}"
    - key: GF_SECURITY_COOKIE_SECURE
      value: "{{ gf_security_cookie_secure | default('true') }}"

- name: Check if remote apps/api/.env already exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/apps/api/.env"
  register: remote_api_env

- name: Render apps/api/.env file from template
  ansible.builtin.template:
    src: api.env.j2
    dest: "{{ app_dir }}/apps/api/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  when: (database_url is defined and database_url != '') or not remote_api_env.stat.exists

- name: Check if remote apps/web/.env.local already exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/apps/web/.env.local"
  register: remote_web_env

- name: Render apps/web/.env.local file from template
  ansible.builtin.template:
    src: web.env.local.j2
    dest: "{{ app_dir }}/apps/web/.env.local"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  when: (next_public_supabase_url is defined and next_public_supabase_url != '') or not remote_web_env.stat.exists

- name: Deploy standalone deploy.sh script to server
  ansible.builtin.template:
    src: deploy.sh.j2
    dest: "{{ app_dir }}/deploy.sh"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
