---
# ============================================================
# Service Restart Playbook for Coditent
# Usage:
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/restart.yml
# ============================================================

- name: Restart Coditent Services
  hosts: all:!local
  become: yes
  gather_facts: no

  tasks:
    - name: Restart Docker Compose services
      ansible.builtin.command:
        cmd: docker compose restart
        chdir: "{{ app_dir }}"

    - name: Wait for application readiness after restart
      ansible.builtin.uri:
        url: "{{ healthcheck_url }}"
        method: GET
        status_code: 200
        return_content: yes
      register: restart_health
      until: restart_health.status == 200
      retries: "{{ healthcheck_retries | default(15) }}"
      delay: "{{ healthcheck_delay | default(3) }}"

    - name: Verify restart readiness
      ansible.builtin.assert:
        that:
          - restart_health.status == 200
          - (restart_health.json.status | default('')) == 'ready'
        fail_msg: "Restart failed: application dependencies are not ready"
        success_msg: "All Coditent services restarted successfully!"
