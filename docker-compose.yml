services:
  db:
    image: postgres:16-alpine
    container_name: coditent-db
    environment:
      POSTGRES_DB: coditent
      POSTGRES_USER: coditent
      POSTGRES_PASSWORD: coditent
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coditent -d coditent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: coditent-api
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: http://localhost:3001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: local-dev-secret
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_COOKIE_SECURE: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: http://localhost:8001/auth/sso/google/callback
    ports:
      - "8001:8001"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: coditent-worker
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: local-dev-secret
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks worker --loglevel=info

  redis:
    image: redis:7-alpine
    container_name: coditent-redis
    ports:
      - "6379:6379"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    container_name: coditent-web
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3001:3000"

volumes:
  db_data:
