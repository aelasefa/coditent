services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: coditent-api
    restart: on-failure
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      FRONTEND_URL: http://localhost:3001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_COOKIE_SECURE: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: http://localhost:8001/auth/sso/google/callback
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: coditent-vault-token-secret
    volumes:
      - ./apps/api:/app
    ports:
      - "8001:8001"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: coditent-worker
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks worker --loglevel=info

  redis:
    image: redis:7-alpine
    container_name: coditent-redis
    ports:
      - "127.0.0.1:6380:6379"


  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    container_name: coditent-web
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3001:3000"

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: coditent-proxy
    restart: always
    ports:
       - "8080:80"      
       - "8443:443"

    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

  vault:
    image: hashicorp/vault:1.15.0
    container_name: coditent-vault
    restart: always
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "coditent-vault-token-secret"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK