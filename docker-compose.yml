services:
  # ──────────────────────────────────────────────────────────────────────────
  # HashiCorp Vault — Secret Store
  # All application secrets live here at secret/data/coditent.
  # Bootstrap once with: python scripts/vault_init_secrets.py
  # ──────────────────────────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: coditent-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-coditent-vault-token-secret}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: vault server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    image: coditent-api:local
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: on-failure
    cap_drop:
      - ALL
    env_file:
      - ./.env
    environment:
      # ── Vault bootstrap (unlocks all other secrets) ─────────────────────
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-coditent-vault-token-secret}
      # ── Non-secret infrastructure config ────────────────────────────────
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ACCESS_TOKEN_COOKIE_SECURE: "${ACCESS_TOKEN_COOKIE_SECURE:-false}"
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/auth/sso/google/callback}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-http://localhost:8001/auth/sso/linkedin/callback}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-CODITENT}
      # ── DB pool bounds (service-specific) ───────────────────────────────
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
      DB_POOL_TIMEOUT_SECONDS: "15"
      DB_POOL_RECYCLE_SECONDS: "300"
      READINESS_CHECK_TIMEOUT_SECONDS: "${READINESS_CHECK_TIMEOUT_SECONDS:-10}"
      WORKER_HEARTBEAT_TTL_SECONDS: "${WORKER_HEARTBEAT_TTL_SECONDS:-30}"
    volumes:
      - ./apps/api:/app
    ports:
      - "127.0.0.1:8001:8001"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8001 --no-access-log"
    depends_on:
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=12)\"",
        ]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  worker:
    image: coditent-api:local
    restart: unless-stopped
    cap_drop:
      - ALL
    env_file:
      - ./.env
    depends_on:
      vault:
        condition: service_healthy
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-coditent-vault-token-secret}
      REDIS_URL: redis://redis:6379/0
      # Each prefork process runs one AI job at a time, but a running job
      # needs a second connection for lease heartbeats and the final
      # stale-source check while its domain transaction stays open.
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
      DB_POOL_TIMEOUT_SECONDS: "15"
      DB_POOL_RECYCLE_SECONDS: "300"
      READINESS_CHECK_TIMEOUT_SECONDS: "${READINESS_CHECK_TIMEOUT_SECONDS:-10}"
      WORKER_HEARTBEAT_TTL_SECONDS: "${WORKER_HEARTBEAT_TTL_SECONDS:-30}"
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.health import worker_heartbeat_is_fresh_sync; raise SystemExit(0 if worker_heartbeat_is_fresh_sync() else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ai-dispatcher:
    image: coditent-api:local
    restart: unless-stopped
    cap_drop:
      - ALL
    env_file:
      - ./.env
    depends_on:
      vault:
        condition: service_healthy
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-coditent-vault-token-secret}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
      DB_POOL_TIMEOUT_SECONDS: "15"
      DB_POOL_RECYCLE_SECONDS: "300"
      READINESS_CHECK_TIMEOUT_SECONDS: "${READINESS_CHECK_TIMEOUT_SECONDS:-10}"
      WORKER_HEARTBEAT_TTL_SECONDS: "${WORKER_HEARTBEAT_TTL_SECONDS:-30}"
    command: python -m app.ai_dispatcher
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.health import dispatcher_heartbeat_is_fresh_sync; raise SystemExit(0 if dispatcher_heartbeat_is_fresh_sync() else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  web:
    restart: unless-stopped
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api-proxy
        NEXT_PUBLIC_OAUTH_API_URL: ${NEXT_PUBLIC_OAUTH_API_URL:-http://localhost:8001}
        BACKEND_PROXY_URL: http://api:8001
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: /api-proxy
      NEXT_PUBLIC_OAUTH_API_URL: ${NEXT_PUBLIC_OAUTH_API_URL:-http://localhost:8001}
      BACKEND_PROXY_URL: http://api:8001
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3001:80"
      - "127.0.0.1:8443:443"

    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -T 12 -q -O /dev/null http://127.0.0.1/ready || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 10
