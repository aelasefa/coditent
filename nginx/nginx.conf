load_module modules/ngx_http_modsecurity_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never log query strings or referrers: both can carry invitation, OAuth,
    # and legacy WebSocket credentials. The API emits template-based request
    # telemetry for diagnostics without cardinality or secret leakage.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" '
                    '"$http_x_forwarded_for" "$request_id"';

    access_log /var/log/nginx/access_log.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Rate limiting zone for authentication / API protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Docker service addresses change whenever a container is recreated. Keep
    # upstream DNS fresh so nginx does not continue sending traffic to a stale
    # container IP and return 502 until it is manually restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream web_backend {
        zone web_backend 64k;
        server web:3000 resolve;
    }

    upstream api_backend {
        zone api_backend 64k;
        server api:8001 resolve;
    }

    # ==========================================
    # Non-local hostnames retain the HTTPS redirect.
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location / {
            return 308 https://$host:8443$request_uri;
        }
    }

    # Compose publishes this port on loopback only. Local development uses
    # HTTP so browsers do not need to trust a self-signed certificate.
    server {
        listen 80;
        listen [::]:80;
        server_name localhost 127.0.0.1;

        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        include /etc/nginx/includes/proxy-routes.conf;
    }

    # ==========================================
    # HTTPS Server: SSL/TLS Termination & Proxy
    # ==========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost _;

        # Enable ModSecurity Web Application Firewall (WAF)
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;

        # SSL Certificates (Generated on container start if missing)

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL Protocol & Cipher Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers (OWASP & Subject Compliance)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:;" always;

        include /etc/nginx/includes/proxy-routes.conf;
    }
}
