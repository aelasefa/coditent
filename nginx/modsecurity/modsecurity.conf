# ============================================================
# ModSecurity v3 Configuration — Coditent WAF Engine
# ============================================================

# Enable WAF Rule Engine in full blocking mode
SecRuleEngine On

# Inspect Request Bodies
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Audit Logging Configuration
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|(?:4(?!04)))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit.log

# Temporary Directories
SecTmpDir /tmp/
SecDataDir /tmp/

# Basic Protections & Rules
SecArgumentSeparator &
SecCookieFormat 0

# Profile prose and portfolio URLs can resemble generic injection signatures.
# Exclude only JSON arguments on the exact authenticated profile update route;
# Nginx limits and all non-body WAF checks continue to apply.
SecRule REQUEST_METHOD "@streq PUT" \
    "id:100005,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /api-proxy/candidates/profile" \
        "chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:[a-z0-9.+-]+\+)?json(?:\s*;|$)" \
            "ctl:ruleRemoveTargetById=100001;ARGS,ctl:ruleRemoveTargetById=100002;ARGS,ctl:ruleRemoveTargetById=100004;ARGS,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS,ctl:ruleRemoveTargetByTag=attack-xss;ARGS"

# Custom Rules: SQL Injection, XSS, Path Traversal, Command Injection Protection
SecRule ARGS "@detectSQLi" \
    "id:100001,phase:2,deny,status:403,log,msg:'Coditent WAF: SQL Injection Attempt Detected'"

SecRule ARGS "@detectXSS" \
    "id:100002,phase:2,deny,status:403,log,msg:'Coditent WAF: Cross-Site Scripting (XSS) Attempt Detected'"

SecRule REQUEST_URI "@rx \.\./|\.\.\\" \
    "id:100003,phase:1,deny,status:403,log,msg:'Coditent WAF: Path Traversal Attempt Detected'"

# Header syntax legitimately uses semicolons (language weights, user agents,
# client hints, cookies and content types). Inspect application arguments for
# this shell-metacharacter rule; header punctuation is not a shell command.
SecRule ARGS "@rx (?:;|\||`|\$\(|\${)" \
    "id:100004,phase:2,deny,status:403,log,msg:'Coditent WAF: Command Injection Attempt Detected'"
