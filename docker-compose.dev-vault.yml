# Explicit local-development override. Never include this file in a production
# Compose invocation. The required interpolation prevents an implicit root
# credential from being created or committed.
services:
  vault:
    image: hashicorp/vault:1.15.0
    container_name: coditent-vault-dev
    profiles: ["dev-vault"]
    restart: "no"
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID:?Set a unique local-only Vault development token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
