name: CI (Continuous Integration)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-web:
    name: Test & Build Frontend (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Test production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
        run: npm run build

  test-api:
    name: Test & Sanity-Check Backend (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check imports
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
          JWT_SECRET: ci-test-jwt-secret-key-1234567890
          GEMINI_API_KEY: ci-test-gemini-key
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_URL: http://localhost:3000
        run: |
          python -c "import app.main; print('API app loaded successfully')"
