name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # STAGE 1: CI (Lint & Test Web + API)
  # ========================================================
  ci-web:
    name: CI - Lint & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Test production build
        env:
          NEXT_PUBLIC_API_URL: http://34.205.255.37
        run: npm run build

  ci-api:
    name: CI - Test Backend Imports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check imports (Supabase-only, no local DB)
        env:
          # Use Supabase-shaped URL (no connection attempted on import); real Supabase not needed for this check
          DATABASE_URL: postgresql+asyncpg://postgres.test:fake@db.test.supabase.co:5432/postgres
          JWT_SECRET: ci-test-jwt-secret-key-1234567890
          GEMINI_API_KEY: ci-test-gemini-key
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_URL: http://localhost:3000
        run: |
          python -c "import app.main; print('API app loaded successfully (Supabase URL validated)')"

  # ========================================================
  # STAGE 2: CD (Deploy to AWS EC2 via Ansible - On push to main)
  # ========================================================
  deploy:
    name: CD - Deploy to AWS EC2 (Ansible)
    needs: [ci-web, ci-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible & Galaxy Collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure SSH Private Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run Ansible Deployment Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy.yml \
            -e "ansible_host=${{ secrets.EC2_HOST }} ansible_user=${{ secrets.EC2_USER }}" \
            -e "ansible_ssh_private_key_file=~/.ssh/id_rsa" \
            -e "repo_branch=${{ github.ref_name }}"

      - name: Verify Live Public Health Endpoint
        run: |
          echo "Verifying public endpoint http://${{ secrets.EC2_HOST }}/health ..."
          curl -s -f --retry 5 --retry-delay 3 http://${{ secrets.EC2_HOST }}/health
          echo "Health check passed!"

