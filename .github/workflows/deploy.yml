name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Never overlap production releases. The image is built on GitHub's runner;
# EC2 only pulls and starts the already-tested artifact.
concurrency:
  group: coditent-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # STAGE 1: CI (Lint & Test Web + API)
  # ========================================================
  secret-scan:
    name: CI - Prevent New Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete commit range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3 uses the supported Node 24 runtime. Pin the immutable release
      # commit, and pin the scanner below the known v8.30.1 rule regression.
      - name: Scan pushed or proposed commits with redacted output
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  ci-web:
    name: CI - Lint & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check source
        run: npx tsc --noEmit

      - name: Test frontend regressions
        run: node --test --experimental-strip-types tests/*.test.mts tests/*.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test production build
        env:
          NEXT_PUBLIC_API_URL: /api-proxy
          NEXT_PUBLIC_OAUTH_API_URL: /api-proxy
          BACKEND_PROXY_URL: http://127.0.0.1:8001
        run: npm run build

  ci-api:
    name: CI - Test Backend
    runs-on: ubuntu-latest
    env:
      SECRET_SOURCE: environment
      RUNTIME_SECRETS_REQUIRED: "false"
      APP_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test Vault launcher and shell syntax
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_vault*.py' -v
          bash -n vault/init.sh scripts/vault-env.sh scripts/run_project.sh scripts/run_project_teammate.sh scripts/deploy-production-image.sh

      - name: Generate ephemeral CI-only signing keys
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          from cryptography.fernet import Fernet
          print(f"CI_JWT_SECRET={secrets.token_urlsafe(48)}")
          print(f"CI_TOTP_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          print(f"CI_EMAIL_OUTBOX_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          PY

      - name: Sanity check imports with isolated CI credentials
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          TOTP_ENCRYPTION_KEY: ${{ env.CI_TOTP_ENCRYPTION_KEY }}
          EMAIL_OUTBOX_ENCRYPTION_KEY: ${{ env.CI_EMAIL_OUTBOX_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ci-placeholder
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_URL: http://localhost:3000
        run: |
          python -c "import app.main; print('API app loaded successfully with CI settings')"

      - name: Run deterministic API regression suites
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          AI_JOB_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          MULTI_USER_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          TOTP_ENCRYPTION_KEY: ${{ env.CI_TOTP_ENCRYPTION_KEY }}
          EMAIL_OUTBOX_ENCRYPTION_KEY: ${{ env.CI_EMAIL_OUTBOX_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ci-placeholder
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_URL: http://localhost:3000
        run: |
          alembic upgrade head
          alembic check
          for test_file in \
            tests/test_account_data_lifecycle.py \
            tests/test_account_recovery.py \
            tests/test_admin_lifecycle.py \
            tests/test_ai_jobs.py \
            tests/test_auth_revocation.py \
            tests/test_avatar_storage.py \
            tests/test_chat_history.py \
            tests/test_chat_realtime.py \
            tests/test_company_logo.py \
            tests/test_cv_asset_lifecycle.py \
            tests/test_cv_upload.py \
            tests/test_database_url.py \
            tests/test_database_integrity.py \
            tests/test_deployment_readiness.py \
            tests/test_email_otp.py \
            tests/test_email_outbox.py \
            tests/test_friend_presence.py \
            tests/test_friendships.py \
            tests/test_multi_user_concurrency.py \
            tests/test_entitlements.py \
            tests/test_health_readiness.py \
            tests/test_institutions.py \
            tests/test_interview_feedback.py \
            tests/test_invitation_routes_unit.py \
            tests/test_match_scoring.py \
            tests/test_migration_revision_recovery.py \
            tests/test_login_account_type.py \
            tests/test_oauth_popup.py \
            tests/test_observability.py \
            tests/test_passwords.py \
            tests/test_production_boundary.py \
            tests/test_rbac.py \
            tests/test_recruiter_candidate_data.py \
            tests/test_recruitment_chat.py \
            tests/test_recruitment_no_duplicates.py \
            tests/test_recruitment_read_events.py \
            tests/test_secret_configuration.py \
            tests/test_social_missions.py \
            tests/test_socket_tickets.py \
            tests/test_two_factor.py \
            tests/test_upload_limits.py \
            tests/test_upload_routes.py
          do
            python -m pytest -q "$test_file"
          done

      - name: Prove backup and restore against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RESTORE_DATABASE_URL: postgresql://test:test@localhost:5432/restore_test
          PGPASSWORD: test
        working-directory: .
        run: |
          createdb -h localhost -U test restore_test
          scripts/test-backup-restore.sh

  ci-ansible:
    name: CI - Validate Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and declared collections
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.14
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check playbooks
        run: bash deploy.sh check

  # ========================================================
  # STAGE 2: Build one immutable backend image outside EC2.
  # ========================================================
  build-api-image:
    name: CD - Build and Push API Image
    needs: [secret-scan, ci-web, ci-api, ci-ansible]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: coditent-${{ github.run_id }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether this immutable image already exists
        id: image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push the tested API image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # STAGE 3: Tell the managed instance to pull and run that image.
  # ========================================================
  deploy:
    name: CD - Deploy API through AWS Systems Manager
    needs: [build-api-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: coditent-${{ github.run_id }}

      - name: Resolve the ECR registry
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Require an online SSM-managed EC2 instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID"
          STATUS="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          test "$STATUS" = "Online"

      - name: Deploy the immutable image with SSM
        env:
          AWS_ACCOUNT_ID: ${{ steps.account.outputs.id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$TESTED_COMMIT"
          jq -n \
            --arg commit "$TESTED_COMMIT" \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            '{commands: [
              "set -eu",
              "cd /opt/coditent",
              "command -v aws >/dev/null",
              "command -v docker >/dev/null",
              "command -v python3 >/dev/null",
              "chown -R ubuntu:ubuntu /opt/coditent",
              "fetch_ok=false; for attempt in 1 2 3 4; do if sudo -u ubuntu git -c http.version=HTTP/1.1 fetch --prune origin main; then fetch_ok=true; break; fi; sleep 15; done; $fetch_ok",
              ("sudo -u ubuntu git cat-file -e " + $commit + "^{commit}"),
              ("sudo -u ubuntu git merge-base --is-ancestor " + $commit + " origin/main"),
              ("sudo -u ubuntu git checkout --force --detach " + $commit),
              ("bash scripts/deploy-production-image.sh " + $image + " " + $commit + " " + $region)
            ]}' > "$RUNNER_TEMP/ssm-commands.json"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Coditent $TESTED_COMMIT" \
            --timeout-seconds 900 \
            --parameters "file://$RUNNER_TEMP/ssm-commands.json" \
            --query 'Command.CommandId' \
            --output text)"

          STATUS="Pending"
          for attempt in {1..90}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success|Cancelled|Failed|TimedOut) break ;;
              *) echo "Deployment is $STATUS (poll $attempt/90)"; sleep 10 ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          test "$STATUS" = "Success"

      - name: Verify Live Public Readiness Endpoint
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          case "$PUBLIC_BASE_URL" in
            https://*) ;;
            *) echo "PUBLIC_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          HTTP_BASE_URL="http://${PUBLIC_BASE_URL#https://}"
          HTTP_STATUS="$(curl --proto '=http' --silent --show-error \
            --output /dev/null --write-out '%{http_code}' "${HTTP_BASE_URL%/}/ready")"
          REDIRECT_TARGET="$(curl --proto '=http' --silent --show-error \
            --output /dev/null --write-out '%{redirect_url}' "${HTTP_BASE_URL%/}/ready")"
          test "$HTTP_STATUS" = "308"
          test "$REDIRECT_TARGET" = "${PUBLIC_BASE_URL%/}/ready"
          echo "Verifying public readiness endpoint ..."
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
            --retry 5 --retry-delay 3 "${PUBLIC_BASE_URL%/}/ready"
          PATCH_STATUS="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --request PATCH --output /dev/null --write-out '%{http_code}' \
            "${PUBLIC_BASE_URL%/}/api-proxy/offers/00000000-0000-0000-0000-000000000000/toggle")"
          DELETE_STATUS="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --request DELETE --output /dev/null --write-out '%{http_code}' \
            "${PUBLIC_BASE_URL%/}/api-proxy/candidates/cv")"
          test "$PATCH_STATUS" = "401"
          test "$DELETE_STATUS" = "401"
          echo "Readiness check passed!"
