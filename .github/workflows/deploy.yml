name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # STAGE 1: CI (Lint & Test Web + API)
  # ========================================================
  secret-scan:
    name: CI - Prevent New Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete commit range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3 uses the supported Node 24 runtime. Pin the immutable release
      # commit, and pin the scanner below the known v8.30.1 rule regression.
      - name: Scan pushed or proposed commits with redacted output
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  ci-web:
    name: CI - Lint & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Test production build
        env:
          NEXT_PUBLIC_API_URL: http://34.205.255.37
        run: npm run build

  ci-api:
    name: CI - Test Backend Imports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check imports (Supabase-only, no local DB)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6380/0' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'http://localhost:3000' }}
        run: |
          python -c "import app.main; print('API app loaded successfully (Supabase URL validated)')"

  ci-ansible:
    name: CI - Validate Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and declared collections
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.14
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check playbooks
        run: bash deploy.sh check

  # ========================================================
  # STAGE 2: CD (Deploy to AWS EC2 via Ansible - On push to main)
  # ========================================================
  deploy:
    name: CD - Deploy to AWS EC2 (Ansible)
    needs: [secret-scan, ci-web, ci-api, ci-ansible]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH Private Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null

      - name: Execute Deployment Script on EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            "$SSH_USER@$SSH_HOST" \
            "/opt/coditent/deploy.sh '$TESTED_COMMIT'"

      - name: Verify Live Public Readiness Endpoint
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          case "$PUBLIC_BASE_URL" in
            https://*) ;;
            *) echo "PUBLIC_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          echo "Verifying public readiness endpoint ..."
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
            --retry 5 --retry-delay 3 "${PUBLIC_BASE_URL%/}/ready"
          echo "Readiness check passed!"
