name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # STAGE 1: CI (Lint & Test Web + API)
  # ========================================================
  secret-scan:
    name: CI - Prevent New Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete commit range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3 uses the supported Node 24 runtime. Pin the immutable release
      # commit, and pin the scanner below the known v8.30.1 rule regression.
      - name: Scan pushed or proposed commits with redacted output
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  ci-web:
    name: CI - Lint & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check source
        run: npx tsc --noEmit

      - name: Test frontend regressions
        run: node --test --experimental-strip-types tests/*.test.mts tests/*.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test production build
        env:
          NEXT_PUBLIC_API_URL: /api-proxy
          NEXT_PUBLIC_OAUTH_API_URL: /api-proxy
          BACKEND_PROXY_URL: http://127.0.0.1:8001
        run: npm run build

  ci-api:
    name: CI - Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Generate ephemeral CI-only signing keys
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          from cryptography.fernet import Fernet
          print(f"CI_JWT_SECRET={secrets.token_urlsafe(48)}")
          print(f"CI_TOTP_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          print(f"CI_EMAIL_OUTBOX_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          PY

      - name: Sanity check imports (Supabase-only, no local DB)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          TOTP_ENCRYPTION_KEY: ${{ env.CI_TOTP_ENCRYPTION_KEY }}
          EMAIL_OUTBOX_ENCRYPTION_KEY: ${{ env.CI_EMAIL_OUTBOX_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6380/0' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'http://localhost:3000' }}
        run: |
          python -c "import app.main; print('API app loaded successfully (Supabase URL validated)')"

      - name: Run deterministic API regression suites
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          AI_JOB_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          MULTI_USER_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          TOTP_ENCRYPTION_KEY: ${{ env.CI_TOTP_ENCRYPTION_KEY }}
          EMAIL_OUTBOX_ENCRYPTION_KEY: ${{ env.CI_EMAIL_OUTBOX_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ci-placeholder
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_URL: http://localhost:3000
        run: |
          alembic upgrade head
          alembic check
          for test_file in \
            tests/test_account_data_lifecycle.py \
            tests/test_account_recovery.py \
            tests/test_admin_lifecycle.py \
            tests/test_ai_jobs.py \
            tests/test_auth_revocation.py \
            tests/test_avatar_storage.py \
            tests/test_chat_history.py \
            tests/test_chat_realtime.py \
            tests/test_company_logo.py \
            tests/test_cv_asset_lifecycle.py \
            tests/test_cv_upload.py \
            tests/test_database_url.py \
            tests/test_database_integrity.py \
            tests/test_deployment_readiness.py \
            tests/test_email_otp.py \
            tests/test_email_outbox.py \
            tests/test_friend_presence.py \
            tests/test_friendships.py \
            tests/test_multi_user_concurrency.py \
            tests/test_entitlements.py \
            tests/test_health_readiness.py \
            tests/test_institutions.py \
            tests/test_interview_feedback.py \
            tests/test_invitation_routes_unit.py \
            tests/test_match_scoring.py \
            tests/test_migration_revision_recovery.py \
            tests/test_login_account_type.py \
            tests/test_oauth_popup.py \
            tests/test_observability.py \
            tests/test_passwords.py \
            tests/test_production_boundary.py \
            tests/test_rbac.py \
            tests/test_recruiter_candidate_data.py \
            tests/test_recruitment_chat.py \
            tests/test_recruitment_no_duplicates.py \
            tests/test_recruitment_read_events.py \
            tests/test_secret_configuration.py \
            tests/test_social_missions.py \
            tests/test_socket_tickets.py \
            tests/test_two_factor.py \
            tests/test_upload_limits.py \
            tests/test_upload_routes.py
          do
            python -m pytest -q "$test_file"
          done

      - name: Prove backup and restore against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RESTORE_DATABASE_URL: postgresql://test:test@localhost:5432/restore_test
          PGPASSWORD: test
        working-directory: .
        run: |
          createdb -h localhost -U test restore_test
          scripts/test-backup-restore.sh

  ci-ansible:
    name: CI - Validate Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and declared collections
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.14
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check playbooks
        run: bash deploy.sh check

  # ========================================================
  # STAGE 2: CD (Deploy to AWS EC2 via Ansible - On push to main)
  # ========================================================
  deploy:
    name: CD - Deploy to AWS EC2 (Ansible)
    needs: [secret-scan, ci-web, ci-api, ci-ansible]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH Private Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and Galaxy collections
        working-directory: ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.17.14
          ansible-galaxy collection install -r requirements.yml

      - name: Wait for EC2 SSH and passwordless sudo
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if ssh \
              -i "$HOME/.ssh/id_rsa" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$SSH_USER@$SSH_HOST" \
              'sudo -n true'; then
              echo "EC2 SSH and passwordless sudo are ready"
              exit 0
            fi
            echo "EC2 is not ready (attempt $attempt/10); retrying in 15 seconds ..."
            sleep 15
          done
          echo "EC2 did not provide a usable SSH session after 10 attempts" >&2
          exit 1

      - name: Provision trusted TLS ingress
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook \
            -i inventory/hosts.ini \
            playbooks/setup.yml \
            --limit production \
            --private-key "$HOME/.ssh/id_rsa" \
            --timeout 30 \
            --ssh-extra-args="-o ConnectionAttempts=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            --extra-vars "ansible_host=$SSH_HOST ansible_user=$SSH_USER"

      - name: Run Ansible Deployment Playbook
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          TESTED_COMMIT: ${{ github.sha }}
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook \
            -i inventory/hosts.ini \
            playbooks/deploy.yml \
            --limit production \
            --private-key "$HOME/.ssh/id_rsa" \
            --timeout 30 \
            --ssh-extra-args="-o ConnectionAttempts=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            --extra-vars "ansible_host=$SSH_HOST ansible_user=$SSH_USER deploy_commit=$TESTED_COMMIT"

      - name: Verify Live Public Readiness Endpoint
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          case "$PUBLIC_BASE_URL" in
            https://*) ;;
            *) echo "PUBLIC_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          HTTP_BASE_URL="http://${PUBLIC_BASE_URL#https://}"
          HTTP_STATUS="$(curl --proto '=http' --silent --show-error \
            --output /dev/null --write-out '%{http_code}' "${HTTP_BASE_URL%/}/ready")"
          REDIRECT_TARGET="$(curl --proto '=http' --silent --show-error \
            --output /dev/null --write-out '%{redirect_url}' "${HTTP_BASE_URL%/}/ready")"
          test "$HTTP_STATUS" = "308"
          test "$REDIRECT_TARGET" = "${PUBLIC_BASE_URL%/}/ready"
          echo "Verifying public readiness endpoint ..."
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
            --retry 5 --retry-delay 3 "${PUBLIC_BASE_URL%/}/ready"
          echo "Readiness check passed!"
