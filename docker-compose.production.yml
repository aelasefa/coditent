# Production-only overrides. The host Nginx ingress is the sole public
# listener; API, Redis, and the container proxy remain loopback/internal.
services:
  redis:
    restart: unless-stopped

  api:
    image: "${CODITENT_API_IMAGE:?Set the immutable ECR API image URI}"
    restart: unless-stopped
    # Production executes the application packaged by CI. Never shadow it
    # with the repository bind mount used for local development.
    volumes: !reset []
    environment:
      APP_ENV: production
      FRONTEND_URL: "${FRONTEND_URL:?Set the canonical HTTPS frontend origin}"
      CORS_ORIGINS: "${CORS_ORIGINS:?Set explicit HTTPS browser origins}"
      ACCESS_TOKEN_COOKIE_SECURE: "true"
      OAUTH_BROWSER_COOKIE_PATH: "/api-proxy/auth/sso"
      # This public callback must stay on the same origin as OAuth start so
      # the host-bound state cookie survives the Google round trip.
      GOOGLE_REDIRECT_URI: "https://api.coditent.app/api-proxy/auth/sso/google/callback"
      LINKEDIN_REDIRECT_URI: "${LINKEDIN_REDIRECT_URI:-}"

  worker:
    image: "${CODITENT_API_IMAGE:?Set the immutable ECR API image URI}"
    restart: unless-stopped
    environment:
      APP_ENV: production
      FRONTEND_URL: "${FRONTEND_URL:?Set the canonical HTTPS frontend origin}"
      CORS_ORIGINS: "${CORS_ORIGINS:?Set explicit HTTPS browser origins}"
      ACCESS_TOKEN_COOKIE_SECURE: "true"
      GOOGLE_REDIRECT_URI: "https://api.coditent.app/api-proxy/auth/sso/google/callback"
      LINKEDIN_REDIRECT_URI: "${LINKEDIN_REDIRECT_URI:-}"

  ai-dispatcher:
    image: "${CODITENT_API_IMAGE:?Set the immutable ECR API image URI}"
    restart: unless-stopped
    environment:
      APP_ENV: production
      FRONTEND_URL: "${FRONTEND_URL:?Set the canonical HTTPS frontend origin}"
      CORS_ORIGINS: "${CORS_ORIGINS:?Set explicit HTTPS browser origins}"
      ACCESS_TOKEN_COOKIE_SECURE: "true"
